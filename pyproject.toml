[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optrisk"
version = "0.1.0"
description = "European option pricing (BSM, CRR binomial, Monte Carlo), implied volatility, and portfolio scenario risk, validated against QuantLib."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
reference = ["QuantLib>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
optrisk = "optrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that take more than a few seconds",
]
